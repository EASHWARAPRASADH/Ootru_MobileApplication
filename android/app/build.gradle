plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mighty.delivery"

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    compileSdkVersion 36
    ndkVersion "29.0.13113456"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // ── FLAVOR DIMENSIONS ──────────────────────────────────────────────────────
    flavorDimensions "role"

    productFlavors {
        // ── App 1: Freeleft (Customer) ──────────────────────────────────────────
        user {
            dimension "role"
            applicationId "com.freeleft.user"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "Freeleft"
        }

        // ── App 2: Freeleft Riders (Delivery Partner) ───────────────────────────
        riders {
            dimension "role"
            applicationId "com.freeleft.riders"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "Freeleft Riders"
        }
    }
    // ────────────────────────────────────────────────────────────────────────────

    defaultConfig {
        // applicationId is overridden per flavor above
        minSdkVersion 28
        targetSdkVersion 35
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    googleServices { disableVersionCheck = true }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.20"
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.browser:browser:1.3.0'
    implementation('com.braintreepayments.api:drop-in:5.2.1') {
        exclude group: "org.jfrog.cardinalcommerce.gradle", module: "cardinalmobilesdk"
    }
    implementation "org.jfrog.cardinalcommerce.gradle:cardinalmobilesdk:2.2.7-2"
}
